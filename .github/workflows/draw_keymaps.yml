name: Draw keymaps
run-name: Draw keymaps

on:
  push:

jobs:
  draw_base_keymap:
    name: Draw BASE keymap
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/keymap/qwerty.keymap"
      config_path:    "keymap-drawer/config.yaml"
      output_folder:  "keymap-drawer/base"
      json_path:      "config"
      parse_args:     "-c 10"
      draw_args:      "qwerty:'-s Base --keys-only'"
      amend_commit:   false
      destination:    artifact
      commit_message: "Add BASE-layer keymaps"
      artifact_name: base-keymap
      fail_on_error:  true
      debug_mode:     false
  draw_full_keymap:
    name: Draw FULL keymaps
    needs: draw_base_keymap
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/keymap/qwerty.keymap"
      config_path:    "keymap-drawer/config.yaml"
      output_folder:  "keymap-drawer"
      json_path:      "config"
      parse_args:     "-c 10"
      draw_args:      ""
      amend_commit:   false
      destination:    artifact
      commit_message: "Add full keymaps"
      artifact_name: full-keymaps
      fail_on_error:  true
      debug_mode:     false

  draw_a4_keymap:
    name: Draw A4 EN/RU keymap
    needs: draw_full_keymap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download parsed keymap
        uses: actions/download-artifact@v4
        with:
          name: full-keymaps
          path: keymap-drawer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install drawing and PDF dependencies
        run: |
          python -m pip install --disable-pip-version-check keymap-drawer reportlab cairosvg pillow
          sudo apt-get install -y fonts-dejavu-core

      - name: Draw selected combos with Keymap Drawer
        run: |
          python scripts/prepare_combo_diagram.py \
            --keymap keymap-drawer/qwerty.yaml \
            --output tmp/pdfs/combos-print.yaml
          mkdir -p keymap-drawer/combos
          keymap -c keymap-drawer/config.yaml draw \
            -j config/qwerty.json \
            -o keymap-drawer/combos/qwerty.svg \
            tmp/pdfs/combos-print.yaml

      - name: Render five layers on A4
        run: |
          python scripts/render_keymap_a4.py \
            --keymap keymap-drawer/qwerty.yaml \
            --layout config/qwerty.json \
            --full-svg keymap-drawer/qwerty.svg \
            --combo-svg keymap-drawer/combos/qwerty.svg \
            --output output/pdf/qwerty-a4.pdf

      - name: Upload Keymap Drawer combo diagram
        uses: actions/upload-artifact@v4
        with:
          name: combo-diagram
          path: keymap-drawer/combos/qwerty.svg

      - name: Upload printable keymap
        uses: actions/upload-artifact@v4
        with:
          name: a4-keymap
          path: output/pdf/qwerty-a4.pdf

  publish_keymaps:
    name: Publish all keymaps
    needs: [draw_base_keymap, draw_full_keymap, draw_a4_keymap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Download base keymap artifact
        uses: actions/download-artifact@v4
        with:
          name: base-keymap
          path: keymap-drawer/base

      - name: Download full keymap artifact
        uses: actions/download-artifact@v4
        with:
          name: full-keymaps
          path: keymap-drawer

      - name: Download printable keymap artifact
        uses: actions/download-artifact@v4
        with:
          name: a4-keymap
          path: output/pdf

      - name: Download Keymap Drawer combo diagram
        uses: actions/download-artifact@v4
        with:
          name: combo-diagram
          path: keymap-drawer/combos

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add Russian Base legends to SVG drawings
        run: |
          python scripts/annotate_russian_svg.py \
            keymap-drawer/base/qwerty.svg keymap-drawer/qwerty.svg

      - name: List downloaded files
        run: |
          echo "Downloaded contents:"
          ls -lR keymap-drawer
          echo "--- git status ---"
          git status

      - name: Auto-commit keymap drawings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update keymap drawings"
          file_pattern: keymap-drawer output/pdf/qwerty-a4.pdf
